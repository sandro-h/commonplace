name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Fetch dependencies
        run: make dependencies

      - name: Build core
        run: make core

      - name: Unit test core
        run: make test

      - name: Lint
        run: make lint

      - name: Run test server
        run: make start-test-server

      - name: System test core
        run: make system-test

      - name: Upload test server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-server-log
          path: core/test_server/test_server.log

      - name: Build VSCode extension
        run: make vscode-extension BUILD_NUMBER=$env:GITHUB_RUN_NUMBER-${GITHUB_SHA:0:7}
